---
- hosts: all
  tasks:
    - name: Offline install pyserial from Desktop/BIKES/offline-libraries/wheelhouse
      command: pip3 install pyserial --no-index --find-links=wheelhouse --break-system-packages
      args:
        chdir: "/home/{{ ansible_user }}/Desktop/BIKES/offline-libraries"

    - name: Let the bike user read the GPS serial port
      become: true
      user:
        name: "{{ ansible_user }}"
        groups: dialout
        append: true

    - name: Verify imports
      command: python3 -c "import serial, pythonosc; print('OK')"
      changed_when: false
